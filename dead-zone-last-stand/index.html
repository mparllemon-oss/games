<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101411"><meta name="description" content="Dead Zone: Last Stand — survive the endless zombie waves."><title>Dead Zone: Last Stand</title><link rel="stylesheet" href="./src/style.css"></head>
<body><main id="app"><canvas id="game" aria-label="Zombie survival game"></canvas>
<div id="menu" class="screen"><div class="menu-bg"></div><div class="brand"><div class="eyebrow">EVACUATION ZONE · DISTRICT 09</div><h1>DEAD ZONE<span>LAST STAND</span></h1><p class="tagline">THEY KEEP COMING. YOU KEEP BREATHING.</p><div class="menu-actions"><button id="play" class="primary">NEW RUN <span>↗</span></button><button id="continue" class="secondary hidden">CONTINUE RUN</button><button data-panel="how">HOW TO PLAY</button><button data-panel="stats">STATISTICS</button><button data-panel="settings">SETTINGS</button><button data-panel="credits">CREDITS</button></div><div class="menu-foot"><span>SOLO SURVIVAL</span><span>NO ONE IS COMING</span></div></div><div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="close-modal">×</button><div id="modal-content"></div></div></div></div>
<div id="hud" class="hud hidden"><div class="hud-top"><div class="brand-small">DZ <span>LAST STAND</span></div><div class="wavebox"><small>WAVE</small><strong id="wave">01</strong><span id="enemy-count">0 HOSTILES</span></div><div class="hud-right"><div class="scrap">⚙ <b id="scrap">0</b></div><button id="pause-btn" aria-label="Pause">Ⅱ</button></div></div><div class="health-wrap"><div class="health-icon">✚</div><div class="health-track"><div id="health-fill"></div></div><span id="health-text">100 / 100</span></div><div class="weaponbox"><div class="weapon-icon" id="weapon-icon">⌖</div><div><div id="weapon-name">SERVICE PISTOL</div><div class="ammo"><b id="ammo">12</b><span> / </span><span id="reserve">72</span><span id="reload-text"></span></div></div><div class="quick-weapons" id="quick-weapons"></div></div><div class="buffs" id="buffs"></div><div id="toast" class="toast"></div><div id="bossbar" class="bossbar hidden"><div class="bossname" id="bossname">ARMORED COLOSSUS</div><div><span id="bossfill"></span></div></div><div class="controls-hint" id="desktop-hint">WASD move · Mouse aim · Click fire · R reload · 1–5 weapons · ESC pause</div><div id="touch-ui" class="touch-ui hidden"><div class="stick" id="move-stick"><i></i></div><div class="touch-right"><div class="stick aim-stick" id="aim-stick"><i></i></div><button id="touch-reload">R</button><button id="touch-switch">↻</button></div></div></div>
<div id="overlay" class="overlay hidden"><section class="panel" id="overlay-panel"></section></div></main><script type="module" src="./src/main.js"></script></body></html>
