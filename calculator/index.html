<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141d">
<title>GlassCalc — iOS Scientific Calculator</title>
<style>
:root{color-scheme:dark;--orange:#ff9f0a;--bg:#10141d;--panel:rgba(32,38,51,.76);--number:#343944;--function:#a6aab2;--text:#fff;--muted:#a3aabb}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 20% 12%,#313953 0,transparent 42%),radial-gradient(ellipse at 95% 90%,#4e341c 0,transparent 35%),var(--bg);display:grid;place-items:center;padding:20px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
.app{width:min(100%,510px);position:relative;border:1px solid rgba(255,255,255,.13);border-radius:36px;background:var(--panel);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 28px 75px #0009;padding:18px;overflow:hidden}
.header,.header-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.header{padding:4px 4px 12px}.brand{font-size:17px;font-weight:750;letter-spacing:.2px}.brand span{color:var(--orange)}.header-actions{justify-content:flex-end}.mini{border:1px solid #ffffff22;color:#f5f5f8;background:#ffffff12;border-radius:14px;padding:10px 12px;font-weight:650;font-size:12px}.mini[aria-pressed="true"]{color:#1d1d1d;background:var(--orange)}
.display{height:155px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;text-align:right;padding:16px 7px 18px;touch-action:pan-y;cursor:default}.expression{color:#afb5c3;font-size:17px;min-height:26px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result{font-weight:320;font-variant-numeric:tabular-nums;font-size:clamp(37px,10vw,67px);line-height:1.17;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-1.8px}.result.small{font-size:clamp(27px,7vw,44px)}.result.error{color:#ff7676}
.memory-indicator{min-height:18px;font-size:11px;color:var(--orange);text-align:right;padding-right:8px}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.key{min-width:0;aspect-ratio:1.17;border:1px solid #ffffff0a;border-radius:999px;background:var(--number);color:white;font-size:clamp(21px,5vw,30px);font-weight:450;box-shadow:inset 0 1px #ffffff12;transition:transform .11s ease,background .15s,color .15s;display:grid;place-items:center}.key:active{transform:scale(.92)}.key:focus-visible,.mini:focus-visible,.history-close:focus-visible{outline:3px solid #ffbf66;outline-offset:2px}.key.func{background:var(--function);color:#16181e;font-size:24px}.key.operator{background:var(--orange);color:#fff;font-size:31px}.key.operator.active{background:white;color:var(--orange)}.key.zero{grid-column:span 2;aspect-ratio:auto;border-radius:100px;justify-items:start;padding-left:27%}.scientific,.memory{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}.scientific[hidden]{display:none}.scientific .key,.memory .key{aspect-ratio:auto;min-height:42px;border-radius:17px;font-size:15px;background:#515665}.scientific .key{background:#454d61}.scientific .key:active,.memory .key:active{background:#6e7688}.memory .key{min-height:36px;font-size:13px}.hint{color:#8991a2;font-size:11px;text-align:center;margin:12px 0 2px}
.scrim{display:none;position:absolute;inset:0;background:#0008;z-index:2}.scrim.open{display:block}.drawer{position:absolute;z-index:3;top:0;right:0;bottom:0;width:min(88%,350px);background:rgba(27,32,43,.98);border-left:1px solid #ffffff25;transform:translateX(103%);transition:transform .25s ease;padding:22px 17px;display:flex;flex-direction:column;box-shadow:-12px 0 35px #0004}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer h2{margin:0;font-size:21px}.history-list{flex:1;overflow:auto;margin:18px -5px 0;padding:0 5px}.history-item{display:block;text-align:right;width:100%;padding:14px 9px;background:transparent;border:0;border-bottom:1px solid #ffffff16;color:white}.history-item .old-exp{display:block;color:#aeb5c1;font-size:13px;margin-bottom:6px;overflow-wrap:anywhere}.history-item .old-answer{display:block;font-size:22px;overflow-wrap:anywhere}.empty{color:#aeb5c1;text-align:center;padding-top:35px}.drawer-footer{display:flex;gap:8px}.drawer-footer button{flex:1}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:420px){body{padding:0}.app{width:100%;min-height:100dvh;border:0;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:18px 14px}.keys{gap:9px}.display{height:clamp(124px,23dvh,200px)}.key{aspect-ratio:1.17}.hint{margin-top:15px}}
@media(max-height:690px){.app{padding-top:10px;padding-bottom:10px}.display{height:105px;padding-bottom:8px}.keys{gap:7px}.key{aspect-ratio:1.45}.scientific .key,.memory .key{min-height:32px}.hint{margin-top:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" aria-label="Scientific Calculator">
 <div class="header">
  <div class="brand">Glass<span>Calc</span></div>
  <div class="header-actions">
   <button class="mini" id="angleButton" aria-label="Toggle degrees and radians" title="Angle unit">DEG</button>
   <button class="mini" id="scienceButton" aria-pressed="false" aria-controls="scienceKeys">ƒx</button>
   <button class="mini" id="historyButton" aria-label="Open calculation history">History</button>
  </div>
 </div>
 <div class="display" id="display" title="Swipe left to delete">
  <div class="expression" id="preview" aria-label="Calculation preview"></div>
  <div class="result" id="result" aria-live="polite">0</div>
 </div>
 <div class="memory-indicator" id="memoryStatus" aria-live="polite"></div>
 <div class="scientific" id="scienceKeys" hidden>
  <button class="key" data-value="sin(" title="Sine">sin</button>
  <button class="key" data-value="cos(" title="Cosine">cos</button>
  <button class="key" data-value="tan(" title="Tangent">tan</button>
  <button class="key" data-value="√(" title="Square root">√</button>
  <button class="key" data-value="^" title="Exponent">xʸ</button>
  <button class="key" data-value="(" title="Open parenthesis">(</button>
  <button class="key" data-value=")" title="Close parenthesis">)</button>
  <button class="key" data-value="π" title="Pi">π</button>
  <button class="key" data-value="ℯ" title="Euler's number">e</button>
  <button class="key" data-action="square" title="Square">x²</button>
 </div>
 <div class="memory" aria-label="Memory operations">
  <button class="key" data-action="mc">MC</button>
  <button class="key" data-action="mr">MR</button>
  <button class="key" data-action="mplus">M+</button>
  <button class="key" data-action="mminus">M−</button>
  <button class="key" data-action="backspace" aria-label="Delete last character">⌫</button>
 </div>
 <div class="keys" aria-label="Calculator keypad">
  <button class="key func" id="clearButton" data-action="clear">AC</button>
  <button class="key func" data-action="sign">±</button>
  <button class="key func" data-action="percent">%</button>
  <button class="key operator" data-value="÷">÷</button>
  <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="×">×</button>
  <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="−">−</button>
  <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
  <button class="key zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key operator" data-action="equals">=</button>
 </div>
 <p class="hint">Keyboard supported · Swipe left on the display to delete</p>
 <div class="scrim" id="scrim"></div>
 <aside class="drawer" id="drawer" aria-label="Calculation history" aria-hidden="true">
  <div class="drawer-head"><h2>History</h2><button class="mini history-close" id="closeHistory" aria-label="Close history">✕</button></div>
  <div class="history-list" id="historyList"></div>
  <div class="drawer-footer"><button class="mini" id="clearHistory">Clear history</button><button class="mini" id="closeHistoryBottom">Done</button></div>
 </aside>
</main>
<script>
'use strict';
// Calculator uses an explicit recursive-descent parser: no eval() or Function().
const $ = id => document.getElementById(id);
const resultEl = $('result'), previewEl = $('preview'), clearEl = $('clearButton');
const HISTORY_KEY = 'glasscalc-history-v1';
let expression = '', justEvaluated = false, error = false, memory = null, degreeMode = true;
let history = [];
try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); if (!Array.isArray(history)) history = []; } catch { history = []; }

function formatNumber(n) {
  if (!Number.isFinite(n)) throw Error('Invalid result');
  if (Object.is(n, -0) || Math.abs(n) < 1e-13) n = 0;
  const rounded = Number(n.toPrecision(12));
  return String(rounded);
}
function evaluate(source) {
  // Whitelist tokens, including Unicode calculator symbols and named functions.
  const normalized = source.replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
  const tokenRx = /\s*(sin|cos|tan|sqrt|√|π|ℯ|e|\d+(?:\.\d*)?|\.\d+|[()+*/^%\-])\s*/gy;
  let tokens = [], position = 0;
  while (position < normalized.length) {
    tokenRx.lastIndex = position;
    const m = tokenRx.exec(normalized);
    if (!m) throw Error('Invalid input');
    tokens.push(m[1]); position = tokenRx.lastIndex;
  }
  let i = 0;
  const peek = () => tokens[i];
  const accept = t => { if (peek() === t) { i++; return true; } return false; };
  const requireToken = t => { if (!accept(t)) throw Error('Missing ' + t); };
  function primary() {
    const t = peek();
    if (accept('(')) { const v = sum(); requireToken(')'); return v; }
    if (accept('π')) return Math.PI;
    if (accept('ℯ') || accept('e')) return Math.E;
    if (['sin','cos','tan','sqrt','√'].includes(t)) {
      i++; requireToken('('); const x = sum(); requireToken(')');
      if (t === 'sqrt' || t === '√') { if (x < 0) throw Error('Domain error'); return Math.sqrt(x); }
      const a = degreeMode ? x * Math.PI / 180 : x;
      if (t === 'sin') return Math.sin(a);
      if (t === 'cos') return Math.cos(a);
      if (Math.abs(Math.cos(a)) < 1e-12) throw Error('Undefined tangent');
      return Math.tan(a);
    }
    if (t && /^(?:\d|\.)/.test(t)) { i++; return Number(t); }
    throw Error('Incomplete expression');
  }
  function postfix() { let v = primary(); while (accept('%')) v /= 100; return v; }
  function power() { let v = postfix(); if (accept('^')) v = Math.pow(v, unary()); return v; }
  function unary() { if (accept('+')) return unary(); if (accept('-')) return -unary(); return power(); }
  function product() { let v = unary(); while (peek() === '*' || peek() === '/') { const op = tokens[i++], rhs = unary(); if (op === '/' && rhs === 0) throw Error('Division by zero'); v = op === '*' ? v * rhs : v / rhs; } return v; }
  function sum() { let v = product(); while (peek() === '+' || peek() === '-') { const op = tokens[i++], rhs = product(); v = op === '+' ? v + rhs : v - rhs; } return v; }
  if (!tokens.length) return 0;
  const result = sum();
  if (i !== tokens.length) throw Error('Unexpected symbol');
  if (!Number.isFinite(result)) throw Error('Invalid result');
  return result;
}
function tryValue() { try { return evaluate(expression); } catch { return null; } }
function show() {
  const shown = expression || '0';
  resultEl.textContent = error ? 'Error' : shown;
  resultEl.classList.toggle('error', error);
  resultEl.classList.toggle('small', shown.length > 14);
  const val = !error && !justEvaluated && expression ? tryValue() : null;
  previewEl.textContent = error ? 'Invalid operation' : justEvaluated ? 'Result' : val === null ? '' : '= ' + formatNumber(val);
  clearEl.textContent = expression && !justEvaluated && !error ? 'C' : 'AC';
  $('memoryStatus').textContent = memory === null ? '' : 'M  ' + formatNumber(memory);
  document.querySelectorAll('.key.operator[data-value]').forEach(btn => {
    btn.classList.toggle('active', !error && expression.endsWith(btn.dataset.value));
  });
}
function reset() { expression = ''; justEvaluated = false; error = false; show(); }
function backspace() { if (error || justEvaluated) return reset(); expression = expression.slice(0,-1); show(); }
function append(v) {
  if (error) reset();
  const operators = '+−×÷^';
  if (justEvaluated) { if (!operators.includes(v) && v !== '%') expression = ''; justEvaluated = false; }
  if (/^\d$/.test(v)) {
    if (/[πℯ)%]$/.test(expression)) expression += '×';
    // Replace leading zero in the active number.
    if (/(^|[+−×÷^(])0$/.test(expression)) expression = expression.slice(0,-1);
    expression += v;
  } else if (v === '.') {
    const lastNumber = expression.match(/(?:^|[+−×÷^(])(\d*\.?\d*)$/);
    if (lastNumber && lastNumber[1].includes('.')) return;
    if (/[πℯ)%]$/.test(expression)) expression += '×0';
    else if (!/\d$/.test(expression)) expression += '0';
    expression += '.';
  } else if (operators.includes(v)) {
    if (!expression) { if (v === '−') expression = '−'; else return; }
    else if (/[+−×÷^]$/.test(expression)) {
      // Permit a unary minus after multiplication, division or power.
      if (v === '−' && /[×÷^]$/.test(expression)) expression += v;
      else if (expression !== '−') expression = expression.replace(/[+−×÷^]+$/, v);
    } else if (expression.endsWith('(')) { if (v === '−') expression += v; }
    else expression += v;
  } else if (v === '(' || /^(sin|cos|tan|√)\($/.test(v) || v === 'π' || v === 'ℯ') {
    if (/(?:\d|[πℯ)%])$/.test(expression)) expression += '×';
    expression += v;
  } else if (v === ')') {
    const opens = (expression.match(/\(/g)||[]).length, closes = (expression.match(/\)/g)||[]).length;
    if (opens > closes && /[\dπℯ)%]$/.test(expression)) expression += ')';
  }
  show();
}
function currentValue() { const v = tryValue(); return v === null ? null : Number(formatNumber(v)); }
function equals() {
  if (error || !expression) return;
  try {
    const answer = formatNumber(evaluate(expression));
    history.unshift({ expr:expression, answer }); history = history.slice(0,60);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
    expression = answer.replace(/-/g,'−'); justEvaluated = true; renderHistory(); show();
  } catch { error = true; show(); }
}
function signToggle() {
  if (error) return;
  // Toggle the sign of the last numeric entry, preserving earlier operations.
  const m = expression.match(/(\d+(?:\.\d*)?|\.\d+)$/);
  if (!m) { if (!expression) append('−'); return; }
  const start = expression.length - m[0].length;
  const before = expression.slice(0,start);
  if (before.endsWith('−') && (before.length === 1 || /[+−×÷^(]/.test(before.at(-2)))) {
    expression = before.slice(0,-1) + m[0];
  } else if (before.endsWith('−') && before.length > 1 && !/[+−×÷^(]/.test(before.at(-2))) {
    expression = before.slice(0,-1) + '+' + m[0];
  } else if (before.endsWith('+')) {
    expression = before.slice(0,-1) + '−' + m[0];
  } else expression = before + '−' + m[0];
  justEvaluated = false; show();
}
function percent() {
  if (error) return;
  if (/(?:\d|\)|π|ℯ)$/.test(expression)) { expression += '%'; justEvaluated = false; show(); }
}
function clearEntry() {
  if (error || justEvaluated || !expression) return reset();
  // Clear only the most recent number, while AC resets the entire expression.
  const previous = expression;
  expression = expression.replace(/(?:\d+(?:\.\d*)?|\.\d+)$/, '');
  if (expression === previous) expression = '';
  show();
}
function operate(action) {
  if (action === 'clear') return clearEntry();
  if (action === 'backspace') return backspace();
  if (action === 'equals') return equals();
  if (action === 'sign') return signToggle();
  if (action === 'percent') return percent();
  if (action === 'square') { if (expression && /[\dπℯ)%]$/.test(expression)) { expression += '^2'; justEvaluated = false; show(); } return; }
  if (action === 'mc') memory = null;
  if (action === 'mr') { if (memory !== null) { if (error || justEvaluated) reset(); const v = '(' + formatNumber(memory).replace(/-/g,'−') + ')'; if (/[\dπℯ)%]$/.test(expression)) expression += '×'; expression += v; } }
  if (action === 'mplus' || action === 'mminus') {
    const v = currentValue(); if (v === null) { error = true; show(); return; }
    memory = Number(formatNumber((memory ?? 0) + (action === 'mplus' ? v : -v)));
  }
  show();
}
document.querySelector('.app').addEventListener('click', e => {
  const button = e.target.closest('button[data-value],button[data-action]');
  if (!button) return;
  if (button.dataset.value !== undefined) append(button.dataset.value);
  else operate(button.dataset.action);
});
// Physical keyboard, including numpad and scientific shortcuts.
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || $('drawer').classList.contains('open')) {
    if (e.key === 'Escape') closeHistory();
    return;
  }
  const map = {'*':'×','/':'÷','-':'−',',':'.'};
  if (/^[0-9.]$/.test(e.key) || ['+','-','*','/','^','(',')','%'].includes(e.key)) {
    e.preventDefault(); const v = map[e.key] || e.key; if (v === '%') percent(); else append(v);
  } else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
  else if (e.key === 'Escape') { e.preventDefault(); reset(); }
  else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
});
// Swipe left to remove the last character without obstructing vertical scrolling.
let touchX = null;
$('display').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
$('display').addEventListener('touchend', e => {
  if (touchX !== null && e.changedTouches[0].clientX - touchX < -45) backspace();
  touchX = null;
}, {passive:true});
$('scienceButton').addEventListener('click', () => {
  const area = $('scienceKeys'); area.hidden = !area.hidden;
  $('scienceButton').setAttribute('aria-pressed', String(!area.hidden));
});
$('angleButton').addEventListener('click', () => { degreeMode = !degreeMode; $('angleButton').textContent = degreeMode ? 'DEG' : 'RAD'; show(); });
function openHistory() { $('drawer').classList.add('open'); $('scrim').classList.add('open'); $('drawer').setAttribute('aria-hidden','false'); renderHistory(); $('closeHistory').focus(); }
function closeHistory() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('drawer').setAttribute('aria-hidden','true'); $('historyButton').focus(); }
function renderHistory() {
  const list = $('historyList'); list.replaceChildren();
  if (!history.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'No calculations yet'; list.append(empty); return; }
  history.forEach(entry => {
    const btn = document.createElement('button'); btn.className = 'history-item';
    const exp = document.createElement('span'); exp.className = 'old-exp'; exp.textContent = entry.expr;
    const ans = document.createElement('span'); ans.className = 'old-answer'; ans.textContent = '= ' + entry.answer;
    btn.append(exp,ans);
    btn.addEventListener('click', () => { expression = entry.answer.replace(/-/g,'−'); error = false; justEvaluated = true; show(); closeHistory(); });
    list.append(btn);
  });
}
$('historyButton').addEventListener('click',openHistory);
$('closeHistory').addEventListener('click',closeHistory);
$('closeHistoryBottom').addEventListener('click',closeHistory);
$('scrim').addEventListener('click',closeHistory);
$('clearHistory').addEventListener('click', () => { history = []; try { localStorage.removeItem(HISTORY_KEY); } catch {} renderHistory(); });
renderHistory(); show();
</script>
</body>
</html>
